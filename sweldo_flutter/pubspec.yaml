name: sweldo
description: "Sweldo - non-custodial payroll on Stellar"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  go_router: ^17.5.0
  stellar_flutter_sdk: ^3.8.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  http: ^1.6.0
  intl: ^0.20.3
  uuid: ^4.6.0
  reown_sign: ^1.4.1
  qr_flutter: ^4.1.0
  reown_core: ^1.5.1
  cupertino_icons: ^1.0.9
  lucide_icons_flutter: ^3.1.22
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-400.ttf
          weight: 400
        - asset: assets/fonts/Archivo-500.ttf
          weight: 500
        - asset: assets/fonts/Archivo-600.ttf
          weight: 600
        - asset: assets/fonts/Archivo-700.ttf
          weight: 700
        - asset: assets/fonts/Archivo-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
