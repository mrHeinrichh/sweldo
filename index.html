<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sweldo — payroll locked on Stellar. Claim your pay on payday." />
    <meta name="theme-color" content="#F2F5F0" />
    <link rel="preload" href="/fonts/Archivo-800.ttf" as="font" type="font/ttf" crossorigin />

    <title>Sweldo</title>

  <body>
    <div id="root">
      <div role="status" style="min-height:100dvh;display:grid;place-content:center;gap:16px;text-align:center;background:#F2F5F0;color:#14213A;font:16px/1.5 system-ui;padding:24px;box-sizing:border-box">
        <svg width="44" height="44" viewBox="0 0 44 44" style="margin:auto;color:#5B3CC4" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-width="3" opacity=".2"/><circle cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="35 113"><animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="1.2s" repeatCount="indefinite"/></circle></svg>
        <strong>Opening Sweldo</strong>
        <span>Getting your payroll workspace ready.<br />Choose your role to get started.</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
